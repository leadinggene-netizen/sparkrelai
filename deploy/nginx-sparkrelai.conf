# nginx reverse proxy for the TradingView -> MT5 portal.
# deploy.sh replaces DOMAIN_PLACEHOLDER and PORT_PLACEHOLDER.
# Certbot will add the HTTPS (443) block when you run it.
server {
    listen 80;
    server_name DOMAIN_PLACEHOLDER;

    # TradingView webhooks and the EA poll frequently; keep bodies small.
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:PORT_PLACEHOLDER;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
